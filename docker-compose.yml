services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4040:4040"
    environment:
      - NODE_ENV=development
      - PORT=4040
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/multi_store
      - DB_SYNC=true
      - DB_SSL=false
      - JWT_SECRET=dev-secret-key-min-32-characters-long-key
      - CORS_ORIGIN=*
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: multi_store
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

